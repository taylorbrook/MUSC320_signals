<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#333">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#4A90D9">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-v1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#E67E22">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-v2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#27AE60">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-v3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#8E44AD">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-out" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#555">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- Main title -->
  <text x="480" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">
    Signal Flow
  </text>

  <!-- ==================== LEVEL 1: Abstract ==================== -->
  <text x="480" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A90D9" font-weight="bold">
    Level 1: How signal flow works (any synthesizer)
  </text>

  <!-- Sound Source box -->
  <rect x="140" y="80" width="160" height="50" rx="10" ry="10" fill="#EBF5FF" stroke="#4A90D9" stroke-width="2"/>
  <text x="220" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Sound Source</text>

  <!-- Arrow: Source -> Processing -->
  <line x1="300" y1="105" x2="370" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Processing (DSP) box -->
  <rect x="380" y="80" width="180" height="50" rx="10" ry="10" fill="#EBF5FF" stroke="#4A90D9" stroke-width="2"/>
  <text x="470" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Processing</text>
  <text x="470" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666">(DSP)</text>

  <!-- Arrow: Processing -> Output -->
  <line x1="560" y1="105" x2="630" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output box -->
  <rect x="640" y="80" width="160" height="50" rx="10" ry="10" fill="#EBF5FF" stroke="#4A90D9" stroke-width="2"/>
  <text x="720" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Output</text>

  <!-- ==================== Divider ==================== -->
  <line x1="30" y1="165" x2="930" y2="165" stroke="#CCC" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- Dotted mapping lines from Level 1 to Level 2 -->
  <line x1="220" y1="130" x2="100" y2="220" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="470" y1="130" x2="350" y2="290" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="720" y1="130" x2="870" y2="290" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- ==================== LEVEL 2: Concrete ==================== -->
  <text x="480" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A90D9" font-weight="bold">
    Level 2: Our noise sculpture's signal chain
  </text>

  <!-- Voice 1 (Orange): noise~ -> *~ with phasor~ LFO modulation -->
  <text x="90" y="218" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#E67E22" font-weight="bold">Voice 1</text>

  <rect x="50" y="228" width="80" height="32" rx="6" ry="6" fill="#FFF3E0" stroke="#E67E22" stroke-width="2"/>
  <text x="90" y="249" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#E67E22">noise~</text>

  <line x1="130" y1="244" x2="180" y2="244" stroke="#E67E22" stroke-width="2" marker-end="url(#arrow-v1)"/>

  <rect x="190" y="228" width="65" height="32" rx="6" ry="6" fill="#FFF3E0" stroke="#E67E22" stroke-width="2"/>
  <text x="222" y="249" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#E67E22">*~</text>

  <!-- phasor~ LFO driving Voice 1 amplitude -->
  <rect x="165" y="272" width="100" height="26" rx="6" ry="6" fill="#FFF3E0" stroke="#E67E22" stroke-width="1.5"/>
  <text x="215" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#E67E22">phasor~ LFO</text>
  <line x1="215" y1="272" x2="215" y2="260" stroke="#E67E22" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Voice 2 (Green): cycle~ -> *~ -->
  <text x="90" y="318" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#27AE60" font-weight="bold">Voice 2</text>

  <rect x="50" y="328" width="85" height="32" rx="6" ry="6" fill="#E8F8E8" stroke="#27AE60" stroke-width="2"/>
  <text x="92" y="349" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#27AE60">cycle~</text>

  <line x1="135" y1="344" x2="180" y2="344" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow-v2)"/>

  <rect x="190" y="328" width="65" height="32" rx="6" ry="6" fill="#E8F8E8" stroke="#27AE60" stroke-width="2"/>
  <text x="222" y="349" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#27AE60">*~</text>

  <!-- Voice 3 (Purple): two cycle~ objects multiplied (AM) -->
  <text x="90" y="418" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8E44AD" font-weight="bold">Voice 3 (AM)</text>

  <rect x="50" y="428" width="85" height="32" rx="6" ry="6" fill="#F3E8F9" stroke="#8E44AD" stroke-width="2"/>
  <text x="92" y="449" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#8E44AD">cycle~</text>

  <line x1="135" y1="444" x2="180" y2="444" stroke="#8E44AD" stroke-width="2" marker-end="url(#arrow-v3)"/>

  <rect x="190" y="428" width="65" height="32" rx="6" ry="6" fill="#F3E8F9" stroke="#8E44AD" stroke-width="2"/>
  <text x="222" y="449" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#8E44AD">*~</text>

  <!-- Second cycle~ feeding into *~ (amplitude modulation) -->
  <rect x="165" y="472" width="85" height="26" rx="6" ry="6" fill="#F3E8F9" stroke="#8E44AD" stroke-width="1.5"/>
  <text x="207" y="490" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8E44AD">cycle~</text>
  <line x1="215" y1="472" x2="215" y2="460" stroke="#8E44AD" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- All three voices converge to +~ (mixing/summing) -->
  <!-- Voice 1 *~ -> +~ -->
  <line x1="255" y1="244" x2="350" y2="335" stroke="#E67E22" stroke-width="2" marker-end="url(#arrow-v1)"/>
  <!-- Voice 2 *~ -> +~ -->
  <line x1="255" y1="344" x2="350" y2="344" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow-v2)"/>
  <!-- Voice 3 *~ -> +~ -->
  <line x1="255" y1="444" x2="350" y2="354" stroke="#8E44AD" stroke-width="2" marker-end="url(#arrow-v3)"/>

  <!-- +~ Summing box -->
  <rect x="360" y="325" width="60" height="40" rx="6" ry="6" fill="#F5F5F5" stroke="#555" stroke-width="2"/>
  <text x="390" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#555">+~</text>
  <text x="390" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#888">mix</text>

  <!-- +~ -> *~ master -->
  <line x1="420" y1="345" x2="470" y2="345" stroke="#555" stroke-width="2" marker-end="url(#arrow-out)"/>

  <!-- *~ master volume -->
  <rect x="480" y="329" width="65" height="32" rx="6" ry="6" fill="#F5F5F5" stroke="#555" stroke-width="2"/>
  <text x="512" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#555">*~</text>
  <text x="512" y="374" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#888">master</text>

  <!-- *~ -> live.gain~ -->
  <line x1="545" y1="345" x2="585" y2="345" stroke="#555" stroke-width="2" marker-end="url(#arrow-out)"/>

  <!-- live.gain~ -->
  <rect x="595" y="325" width="100" height="40" rx="6" ry="6" fill="#F5F5F5" stroke="#555" stroke-width="2"/>
  <text x="645" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#555">live.gain~</text>

  <!-- live.gain~ -> clip~ -->
  <line x1="695" y1="345" x2="735" y2="345" stroke="#555" stroke-width="2" marker-end="url(#arrow-out)"/>

  <!-- clip~ -->
  <rect x="745" y="329" width="70" height="32" rx="6" ry="6" fill="#F5F5F5" stroke="#555" stroke-width="2"/>
  <text x="780" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#555">clip~</text>

  <!-- clip~ -> dac~ -->
  <line x1="815" y1="345" x2="855" y2="345" stroke="#555" stroke-width="2" marker-end="url(#arrow-out)"/>

  <!-- dac~ -->
  <rect x="865" y="325" width="70" height="40" rx="6" ry="6" fill="#EBF5FF" stroke="#4A90D9" stroke-width="2"/>
  <text x="900" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#4A90D9">dac~</text>

  <!-- Color legend at bottom -->
  <rect x="140" y="500" width="12" height="12" rx="2" ry="2" fill="#FFF3E0" stroke="#E67E22" stroke-width="1.5"/>
  <text x="158" y="511" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">Voice 1: noise</text>

  <rect x="290" y="500" width="12" height="12" rx="2" ry="2" fill="#E8F8E8" stroke="#27AE60" stroke-width="1.5"/>
  <text x="308" y="511" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">Voice 2: tone</text>

  <rect x="430" y="500" width="12" height="12" rx="2" ry="2" fill="#F3E8F9" stroke="#8E44AD" stroke-width="1.5"/>
  <text x="448" y="511" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">Voice 3: detuned</text>

  <rect x="590" y="500" width="12" height="12" rx="2" ry="2" fill="#F5F5F5" stroke="#555" stroke-width="1.5"/>
  <text x="608" y="511" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">Output chain</text>
</svg>
