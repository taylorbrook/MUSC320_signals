<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <defs>
    <!-- Arrow marker for connections -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#333">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#4A90D9">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-v1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#E67E22">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-v2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#27AE60">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-v3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#8E44AD">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-out" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#555">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- Main title -->
  <text x="450" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">
    Signal Flow: Abstract to Concrete
  </text>

  <!-- ==================== LEVEL 1: Abstract ==================== -->
  <text x="450" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A90D9" font-weight="bold">
    Level 1: How signal flow works (any synthesizer)
  </text>

  <!-- Sound Source box -->
  <rect x="60" y="80" width="160" height="50" rx="10" ry="10" fill="#EBF5FF" stroke="#4A90D9" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Sound Source</text>

  <!-- Arrow: Source -> Processing -->
  <line x1="220" y1="105" x2="290" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Processing box -->
  <rect x="300" y="80" width="200" height="50" rx="10" ry="10" fill="#EBF5FF" stroke="#4A90D9" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Processing</text>
  <text x="400" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666">(amplitude, modulation)</text>

  <!-- Branch from Source: second path going down to Summing -->
  <line x1="140" y1="130" x2="140" y2="185" stroke="#333" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="145" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#888" font-style="italic">branch</text>

  <!-- Summing node (circle) -->
  <circle cx="580" cy="185" r="22" fill="#EBF5FF" stroke="#4A90D9" stroke-width="2"/>
  <text x="580" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">+</text>
  <text x="580" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#888">Summing</text>

  <!-- Arrow: Processing -> Summing -->
  <line x1="500" y1="105" x2="558" y2="185" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Source branch -> Summing -->
  <line x1="140" y1="185" x2="558" y2="185" stroke="#333" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Arrow: Summing -> Output -->
  <line x1="602" y1="185" x2="670" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output box -->
  <rect x="680" y="80" width="160" height="50" rx="10" ry="10" fill="#EBF5FF" stroke="#4A90D9" stroke-width="2"/>
  <text x="760" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Output</text>
  <text x="760" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666">(speakers)</text>

  <!-- ==================== Divider ==================== -->
  <line x1="40" y1="250" x2="860" y2="250" stroke="#CCC" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- Dotted mapping lines from Level 1 to Level 2 -->
  <line x1="140" y1="130" x2="140" y2="310" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="400" y1="130" x2="450" y2="310" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="580" y1="207" x2="560" y2="420" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="760" y1="130" x2="760" y2="480" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- ==================== LEVEL 2: Concrete ==================== -->
  <text x="450" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A90D9" font-weight="bold">
    Level 2: Our noise sculpture's signal chain
  </text>

  <!-- Voice 1 (Orange): noise~ -> *~ (amplitude) with phasor~ LFO -->
  <rect x="50" y="310" width="80" height="32" rx="6" ry="6" fill="#FFF3E0" stroke="#E67E22" stroke-width="2"/>
  <text x="90" y="331" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#E67E22">noise~</text>

  <line x1="130" y1="326" x2="170" y2="326" stroke="#E67E22" stroke-width="2" marker-end="url(#arrow-v1)"/>

  <rect x="180" y="310" width="65" height="32" rx="6" ry="6" fill="#FFF3E0" stroke="#E67E22" stroke-width="2"/>
  <text x="212" y="331" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#E67E22">*~</text>

  <!-- phasor~ LFO driving Voice 1 amplitude -->
  <rect x="160" y="360" width="100" height="28" rx="6" ry="6" fill="#FFF3E0" stroke="#E67E22" stroke-width="1.5"/>
  <text x="210" y="379" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#E67E22">phasor~ LFO</text>
  <line x1="210" y1="360" x2="210" y2="342" stroke="#E67E22" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Voice 1 label -->
  <text x="90" y="304" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#E67E22" font-weight="bold">Voice 1</text>

  <!-- Voice 2 (Green): cycle~ -> *~ (amplitude + beating) -->
  <rect x="50" y="410" width="85" height="32" rx="6" ry="6" fill="#E8F8E8" stroke="#27AE60" stroke-width="2"/>
  <text x="92" y="431" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#27AE60">cycle~</text>

  <line x1="135" y1="426" x2="175" y2="426" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow-v2)"/>

  <rect x="185" y="410" width="65" height="32" rx="6" ry="6" fill="#E8F8E8" stroke="#27AE60" stroke-width="2"/>
  <text x="217" y="431" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#27AE60">*~</text>

  <!-- Voice 2 label -->
  <text x="92" y="404" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#27AE60" font-weight="bold">Voice 2</text>

  <!-- Voice 3 (Purple): cycle~ detuned -> *~ -->
  <rect x="50" y="470" width="85" height="32" rx="6" ry="6" fill="#F3E8F9" stroke="#8E44AD" stroke-width="2"/>
  <text x="92" y="491" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#8E44AD">cycle~</text>

  <line x1="135" y1="486" x2="175" y2="486" stroke="#8E44AD" stroke-width="2" marker-end="url(#arrow-v3)"/>

  <rect x="185" y="470" width="65" height="32" rx="6" ry="6" fill="#F3E8F9" stroke="#8E44AD" stroke-width="2"/>
  <text x="217" y="491" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#8E44AD">*~</text>

  <!-- Voice 3 label + detuned note -->
  <text x="92" y="464" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8E44AD" font-weight="bold">Voice 3 (detuned)</text>

  <!-- All three voices converge to +~ (mixing/summing) -->
  <!-- Voice 1 *~ -> +~ -->
  <line x1="245" y1="326" x2="340" y2="420" stroke="#E67E22" stroke-width="2" marker-end="url(#arrow-v1)"/>
  <!-- Voice 2 *~ -> +~ -->
  <line x1="250" y1="426" x2="340" y2="430" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow-v2)"/>
  <!-- Voice 3 *~ -> +~ -->
  <line x1="250" y1="486" x2="340" y2="440" stroke="#8E44AD" stroke-width="2" marker-end="url(#arrow-v3)"/>

  <!-- +~ Summing box -->
  <rect x="350" y="410" width="60" height="40" rx="6" ry="6" fill="#F5F5F5" stroke="#555" stroke-width="2"/>
  <text x="380" y="436" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#555">+~</text>
  <text x="380" y="462" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#888">mix</text>

  <!-- +~ -> *~ master -->
  <line x1="410" y1="430" x2="460" y2="430" stroke="#555" stroke-width="2" marker-end="url(#arrow-out)"/>

  <!-- *~ master volume -->
  <rect x="470" y="415" width="65" height="32" rx="6" ry="6" fill="#F5F5F5" stroke="#555" stroke-width="2"/>
  <text x="502" y="436" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#555">*~</text>
  <text x="502" y="462" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#888">master</text>

  <!-- *~ -> live.gain~ -->
  <line x1="535" y1="431" x2="575" y2="431" stroke="#555" stroke-width="2" marker-end="url(#arrow-out)"/>

  <!-- live.gain~ -->
  <rect x="585" y="410" width="100" height="40" rx="6" ry="6" fill="#F5F5F5" stroke="#555" stroke-width="2"/>
  <text x="635" y="436" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#555">live.gain~</text>

  <!-- live.gain~ -> clip~ -->
  <line x1="685" y1="430" x2="725" y2="490" stroke="#555" stroke-width="2" marker-end="url(#arrow-out)"/>

  <!-- clip~ -->
  <rect x="735" y="475" width="70" height="32" rx="6" ry="6" fill="#F5F5F5" stroke="#555" stroke-width="2"/>
  <text x="770" y="496" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#555">clip~</text>

  <!-- clip~ -> dac~ -->
  <line x1="770" y1="507" x2="770" y2="538" stroke="#555" stroke-width="2" marker-end="url(#arrow-out)"/>

  <!-- dac~ -->
  <rect x="735" y="548" width="70" height="32" rx="6" ry="6" fill="#EBF5FF" stroke="#4A90D9" stroke-width="2"/>
  <text x="770" y="569" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#4A90D9">dac~</text>

  <!-- Color legend at bottom -->
  <rect x="50" y="560" width="12" height="12" rx="2" ry="2" fill="#FFF3E0" stroke="#E67E22" stroke-width="1.5"/>
  <text x="68" y="571" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">Voice 1: noise</text>

  <rect x="180" y="560" width="12" height="12" rx="2" ry="2" fill="#E8F8E8" stroke="#27AE60" stroke-width="1.5"/>
  <text x="198" y="571" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">Voice 2: tone</text>

  <rect x="300" y="560" width="12" height="12" rx="2" ry="2" fill="#F3E8F9" stroke="#8E44AD" stroke-width="1.5"/>
  <text x="318" y="571" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">Voice 3: detuned</text>

  <rect x="440" y="560" width="12" height="12" rx="2" ry="2" fill="#F5F5F5" stroke="#555" stroke-width="1.5"/>
  <text x="458" y="571" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">Output chain</text>
</svg>
