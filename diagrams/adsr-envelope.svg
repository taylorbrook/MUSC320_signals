<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">

  <!-- Background -->
  <rect x="0" y="0" width="320" height="160" rx="4" ry="4" fill="#F8F8FA"/>

  <!-- Title -->
  <text x="160" y="16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">ADSR Envelope</text>

  <!-- Axes -->
  <line x1="35" y1="130" x2="305" y2="130" stroke="#BBB" stroke-width="1"/>
  <line x1="35" y1="130" x2="35" y2="25" stroke="#BBB" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="18" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#999" transform="rotate(-90 18,80)">amplitude</text>
  <text x="170" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#999">time</text>

  <!-- Sustain level reference line -->
  <line x1="35" y1="65" x2="225" y2="65" stroke="#DDD" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="30" y="68" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#AAA">S</text>

  <!-- Peak level reference line -->
  <line x1="35" y1="32" x2="100" y2="32" stroke="#DDD" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="30" y="35" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#AAA">1</text>

  <!-- ADSR envelope path -->
  <path d="M 35,130 L 100,32 L 150,65 L 225,65 L 290,130"
        fill="none" stroke="#4A90D9" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Filled area under envelope -->
  <path d="M 35,130 L 100,32 L 150,65 L 225,65 L 290,130 Z"
        fill="#4A90D9" opacity="0.1"/>

  <!-- Segment dots -->
  <circle cx="35" cy="130" r="3" fill="#4A90D9"/>
  <circle cx="100" cy="32" r="3" fill="#4A90D9"/>
  <circle cx="150" cy="65" r="3" fill="#4A90D9"/>
  <circle cx="225" cy="65" r="3" fill="#4A90D9"/>
  <circle cx="290" cy="130" r="3" fill="#4A90D9"/>

  <!-- Segment labels -->
  <text x="67" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#E67E22">A</text>
  <text x="125" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#27AE60">D</text>
  <text x="187" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#8E44AD">S</text>
  <text x="257" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#E74C3C">R</text>

  <!-- Segment sublabels -->
  <text x="67" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#E67E22">Attack</text>
  <text x="125" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#27AE60">Decay</text>
  <text x="187" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#8E44AD">Sustain</text>
  <text x="257" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#E74C3C">Release</text>

  <!-- Vertical divider ticks -->
  <line x1="100" y1="128" x2="100" y2="132" stroke="#BBB" stroke-width="1"/>
  <line x1="150" y1="128" x2="150" y2="132" stroke="#BBB" stroke-width="1"/>
  <line x1="225" y1="128" x2="225" y2="132" stroke="#BBB" stroke-width="1"/>

</svg>
