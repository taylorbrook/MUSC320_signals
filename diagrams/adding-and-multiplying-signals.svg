  <text x="400" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">
    Adding signals combines them into one sound. This is how you mix voices in a patch.
  </text>

  <!-- ==================== Divider ==================== -->
  <line x1="30" y1="280" x2="770" y2="280" stroke="#CCC" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- ==================== ROW 2: *~ (Multiplying / Amplitude) ==================== -->
